# Analysis options for the Scythe Companion project.
#
# Built on flutter_lints; adds a few targeted rules that catch real bugs.
# Deliberately kept conservative — the repo is a teaching artifact and
# aggressive linting across every widget file adds noise without value.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Catch async bugs (A10 context-across-async-gaps family)
    unawaited_futures: true

    # Prefer const where it matters
    prefer_const_constructors: true
    prefer_const_declarations: true

# Analyzer settings
analyzer:
  errors:
    unused_import: error
    dead_code: error
