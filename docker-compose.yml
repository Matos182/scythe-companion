# Scythe Companion Server — docker-compose
#
# Brings up the Node socket.io server behind a Caddy reverse proxy that
# terminates TLS (wss://) automatically via Let's Encrypt.
#
# Usage:
#   1. Copy .env.example → .env, fill in DOMAIN and CORS_ORIGIN.
#   2. docker compose up -d
#   3. Verify: curl https://YOUR_DOMAIN/healthz
#
# Caddy auto-obtains and renews the TLS certificate on first start.

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: scythe-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    # Do NOT publish the port publicly — Caddy proxies :443 → server:3000.
    # Expose only inside the Docker network.
    networks:
      - scythe-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT??3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ── Shared-VPS resource guard (T4.7d, OPTIONAL — see DEPLOY.md §0.4) ──
    # Hard caps so this stack can never starve the other services on a
    # shared host. Deliberately COMMENTED OUT by default — uncomment
    # both lines only if you want the caps enforced.
    # mem_limit: 256m
    # cpus: 0.5

  caddy:
    image: caddy:2-alpine
    container_name: scythe-caddy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP → Caddy redirects to HTTPS
      - "443:443" # HTTPS / WSS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # TLS certs + state
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - scythe-net

volumes:
  caddy_data:
  caddy_config:

networks:
  scythe-net:
    driver: bridge
