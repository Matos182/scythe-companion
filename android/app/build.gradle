plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// T4.2: Load release signing credentials from android/key.properties (gitignored).
// The file is OPTIONAL — if absent the release build falls back to the debug
// signing config so `flutter run --release` still works for local testing.
// Matos generates key.properties once on his dev machine and never commits it
// (C2 — credentials never enter the repo). See docs/RELEASE.md for the runbook.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.matos.scythe_companion"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // T4.2: bumped from the placeholder `com.example.scythe` so the
        // release APK lives under Matos's namespace on the Play Store /
        // device app list. Friends who had a v0.3.x debug build installed
        // will need to uninstall it first (different signing key + app id).
        applicationId "com.matos.scythe_companion"
        // minSdkVersion comes from flutter.minSdkVersion (currently 21 —
        // required by flutter_local_notifications for foreground service
        // notifications; documented in T3.4 hand-off).
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // T4.2: Real signing config sourced from key.properties. The config
    // block is registered unconditionally so other Gradle tasks can
    // introspect it; the build types use it only when the props file
    // exists. See docs/RELEASE.md for the keystore-creation recipe.
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // T4.2: When key.properties is present, sign with the release
            // keystore. When absent (CI dev build, fresh clone), fall
            // back to the debug keystore so `flutter run --release` still
            // produces a working APK on a developer's machine.
            signingConfig keystorePropertiesFile.exists() ?
                    signingConfigs.release : signingConfigs.debug

            // T4.2: R8 full-mode — minify (strip unused Dart/Java code)
            // and shrink (drop unused resources). Requires proguard-rules
            // in app/proguard-rules.pro to keep Flutter / plugin
            // reflection happy. The default rules file ships empty —
            // add keep rules per plugin as needed (see docs/RELEASE.md).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}